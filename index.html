function bouquet(){stem(360,276,357,605);stem(210,350,357,605);stem(518,355,357,605);leaf(333,478,-.95,.94);leaf(368,490,1.02,1);leaf(297,427,-1.25,.7);leaf(424,432,1.3,.73);leaf(351,554,-.8,.56);bloom(209,318,.78,-.23,false);bloom(512,330,.82,.22,true);bloom(362,222,1.14,.08,true);g.beginPath();g.moveTo(333,556);g.quadraticCurveTo(359,570,378,553);stroke('#f3c785',7)}

function sample(draw,step){g.clearRect(0,0,S,S);draw();let d=g.getImageData(0,0,S,S).data,arr=[];for(let y=step/2;y<S;y+=step){for(let x=step/2;x<S;x+=step){const ix=(Math.floor(y)*S+Math.floor(x))*4;if(d[ix+3]>95){let xx=x-S/2,yy=y-S/2;arr.push({x:xx,y:yy,z:Math.sin(xx*.012)*Math.cos(yy*.013)*27+rand(-4,4),r:d[ix],g:d[ix+1],b:d[ix+2]})}}}return arr;}

function setStage(n){stage=clamp(n,0,3);elapsed=0;flash=.7;burst(cx,cy,75);document.getElementById('name').classList.toggle('visible',stage===3);document.getElementById('number').textContent=['✦','✧','✷','✦'][stage];document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===stage));if(stage===0){for(let i=0;i<count;i++){let p=particles[i],a=i*2.39996323,r=65+235*Math.sqrt(i/count),arm=(i%4)*TAU/4;let theta=a*.035+r*.018+arm;p.tx=Math.cos(theta)*r;p.ty=Math.sin(theta)*r*.45;p.tz=Math.sin(a)*rand(8,55);p.tr=rand(225,255);p.tg=rand(130,218);p.tb=rand(72,165);p.ta=rand(.28,1)}return}let points=shapes[stage];let prev=-1;particles.sort((a,b)=>a.y-b.y||a.x-b.x);for(let i=0;i<count;i++){const p=particles[i],j=Math.floor(i*points.length/count),q=points[j];p.tx=q.x;p.ty=q.y;p.tz=q.z;p.tr=q.r;p.tg=q.g;p.tb=q.b;p.ta=j!==prev?1:0;prev=j;}}

for(let i=0;i<count;i++){const p=particles[i];p.x=mix(p.x,p.tx,ease);p.y=mix(p.y,p.ty,ease);p.z=mix(p.z,p.tz,ease);p.r=mix(p.r,p.tr,ease);p.g=mix(p.g,p.tg,ease);p.b=mix(p.b,p.tb,ease);p.a=mix(p.a,p.ta,ease);if(p.a<.025)continue;let x=p.x,y=p.y,z=p.z;if(stage===0){let a=x*c-y*s,b=x*s+y*c;x=a;y=b;}if(stage===1){let f=.9+.10*Math.sin(clock*2);z+=Math.abs(x)*Math.sin(clock*2)*.23;x*=f;}let xx=x*cyr-z*syr,zz=x*syr+z*cyr,yy=y*cxr-zz*sxr;zz=y*sxr+zz*cxr;let perspective=900/(900+zz);let px=cx+xx*scale*perspective,py=cy+yy*scale*perspective;if(pointer.active){let dx=px-(pointer.x+1)*W/2,dy=py-(pointer.y+1)*H/2,d=Math.hypot(dx,dy);if(d<90&&d>1){px+=dx/d*(90-d)*.21;py+=dy/d*(90-d)*.21}}let twinkle=.8+.2*Math.sin(clock*2.6+p.seed),alpha=p.a*twinkle*(1-nameFade*.72);ctx.globalAlpha=clamp(alpha,0,1);ctx.fillStyle=`rgb(${p.r|0},${p.g|0},${p.b|0})`;let r=Math.max(.7,(stage===0?1.4:1.55)*p.size*scale*perspective);if(i%11===0&&stage!==0&&stage!==3)ctx.fillText(p.glyph,px,py);else{ctx.fillRect(px-r/2,py-r/2,r,r)}if(i%113===0){ctx.globalAlpha=alpha*.2;ctx.beginPath();ctx.arc(px,py,r*3.3,0,TAU);ctx.fill();}}

requestAnimationFrame(draw)}requestAnimationFrame(draw);
